<!doctype html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#0b0e17">
  <meta name="description" content="Dérive Lab : apprendre à dériver au lycée, étape par étape, avec 24 compétences à débloquer et un clavier mathématique.">
  <title>Dérive Lab — Le jeu des dérivées</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='18' fill='%23a3f5cf'/%3E%3Ctext x='18' y='48' font-family='Georgia' font-size='53' fill='%230b0e17'%3E%E2%88%82%3C/text%3E%3C/svg%3E">
  <link rel="stylesheet" href="./styles.css">
  <style>
    .startup{min-height:100vh;display:grid;place-items:center;padding:24px;background:#0b0e17;color:#eef2fb;font-family:system-ui,sans-serif}
    .startup section{width:min(420px,100%);padding:32px;background:#121724;border:1px solid #273044;border-radius:20px}
    .startup h1{font-size:28px;margin:0 0 12px}.startup p{font-size:14px;color:#9ba8bf;line-height:1.7}
    .startup button{padding:12px 16px;border:0;border-radius:10px;background:#a3f5cf;color:#0b0e17;font-weight:bold;cursor:pointer}
  </style>
</head>
<body>
  <div id="root"><div class="startup"><section>
    <h1>∂ Dérive Lab</h1>
    <p id="startup-status" role="status">Préparation de ton atelier…</p>
    <button id="startup-retry" hidden>Réessayer</button>
    <noscript><p>Active JavaScript dans ton navigateur pour jouer.</p></noscript>
  </section></div></div>
  <script src="./bootstrap.js" defer></script>
</body>
</html>
